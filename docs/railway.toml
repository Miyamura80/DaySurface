# Railway config-as-code for the documentation site (Next.js + Fumadocs).
# Deploy this folder as its own Railway service with Root Directory = docs.
# Docs: https://docs.railway.com/reference/config-as-code
#
# Sibling services in the same Railway project (eito-projects), by role rather
# than by name - the Railway service names have been renamed more than once and
# a stale list here is worse than no list:
#   - the backend service       -> /railway.json        (Python API, mcp.daysurface.com)
#   - the landing-page service  -> /landing-page/...     (Astro static, daysurface.com)
#   - this service              -> this file             (Next.js docs, docs.daysurface.com)
#
# Renaming THIS service moves its `*.railway.internal` private domain, which
# the landing page dials to serve `daysurface.com/docs`. After any rename,
# update `DOCS_UPSTREAM` on the landing-page service AND redeploy it, or the
# apex docs paths 502 while this service still serves fine on its own domain.
# See landing-page/railway.toml.
#
# Builder is RAILPACK: Railway auto-detects the bun/Next.js project from bun.lock.
# `bun install` runs the `postinstall` hook (fumadocs-mdx) to generate .source.

[build]
builder = "RAILPACK"
buildCommand = "bun run build"

[deploy]
# Bind IPv6 (`::`), not the Next default of 0.0.0.0: Railway's private network
# is IPv6-only, and the landing page reaches this service over it via
# `DOCS_UPSTREAM`. Binding IPv4-only makes every proxied docs request fail.
# `$PORT` is set explicitly on the service so the proxy has a fixed port to
# target - see the DOCS_UPSTREAM note in landing-page/railway.toml.
startCommand = "bun run start --hostname :: --port $PORT"
# Must be a path that returns 200, not a redirect. Under
# `hideLocale: "default-locale"` both "/" and "/en" 307 toward the canonical
# docs root, so only "/docs" answers directly.
healthcheckPath = "/docs"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
