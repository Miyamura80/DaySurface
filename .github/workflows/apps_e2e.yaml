name: MCP-App E2E (Goose GUI)

# L4 rendered-iframe tier: drive the REAL Goose desktop (Electron) as an MCP client
# and assert the ui:// apps actually render + round-trip in a real host. This is the
# heavy tier (Rust build of the goose CLI + Electron + pnpm), so it is deliberately
# OFF the push/PR path - `make ci` stays the fast gate. It runs on demand and weekly.
# Harness + rationale: .agents/skills/goose-gui-e2e/SKILL.md
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  apps_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read Python version
        run: echo "PYTHON_VERSION=$(cat .python-version | tr -d '\n')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: System libraries for Electron + Xvfb
        # Canonical Chromium/Electron runtime deps for the ubuntu-latest (24.04)
        # image, needed before setup.sh drives electron-forge under Xvfb.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb unzip \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libxkbcommon0 libatspi2.0-0t64 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libgtk-3-0t64 libxshmfence1

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python deps
        run: uv sync

      - name: Build Goose desktop (one-time; ~15-20 min on a cold runner)
        run: bash .agents/skills/goose-gui-e2e/scripts/setup.sh

      - name: Run MCP-App e2e scenarios (guarded pytest entry)
        # --no-cov: this single-file run must not trip pytest.ini's --cov-fail-under
        # gate (coverage is a whole-suite metric; the harness asserts elsewhere).
        run: RUN_APPS_E2E=1 uv run pytest tests/test_apps_e2e.py -v -s --no-cov

      - name: Upload screenshots + logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apps-e2e-artifacts
          path: |
            ~/goose-e2e/shot_*.png
            ~/goose-e2e/*.log
            ~/goose-e2e/test_*.out
            ~/goose-e2e/pw_result_*.json
          if-no-files-found: ignore
