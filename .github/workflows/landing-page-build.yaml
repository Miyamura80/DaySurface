name: Landing Page Build

on:
  push:
    branches:
      - '**'
    paths:
      - 'landing-page/**'
      - '.github/workflows/landing-page-build.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'landing-page/**'
      - '.github/workflows/landing-page-build.yaml'
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch (e.g. rapid successive pushes).
concurrency:
  group: landing-page-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event.pull_request == null
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./landing-page
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducible CI; bump deliberately alongside local dev.
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # After the build: agent-journey.test.ts drives the real server against
      # `dist/`, because the behaviour it pins (404s on unknown paths, the
      # /signup aliases, Accept: text/markdown negotiation) lives in the routing
      # rather than in any page.
      - name: Test
        run: bun test
