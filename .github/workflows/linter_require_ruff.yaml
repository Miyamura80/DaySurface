name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'
    paths-ignore:
      - '.github/workflows/**'

jobs:
  lint:
    if: github.event_name == 'pull_request' || github.event.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Python version
        run: echo "PYTHON_VERSION=$(cat .python-version | tr -d '\n')" >> $GITHUB_ENV
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.13.4/install.sh | sh
      - name: Add uv to path
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Setup
        run: uv sync && make install_tools
      - name: Run ruff
        run: make ruff
      - name: Run complexity check
        run: make complexity
      - name: Run tech debt check
        run: make tech_debt
      - name: Run duplicate code check
        run: make duplicate_code
      - name: Run AI writing check
        run: uv run python scripts/check_ai_writing.py
      - name: Run import-linter
        run: make import_lint
      - name: Run file length check
        run: uv run python scripts/check_file_length.py
      - name: Run blind-except justification check
        run: uv run python scripts/check_blind_except_justification.py
      # `make ci` runs from release.yml on v* tags only, so without this the
      # docs-vs-registry check never gates a pull request. Python-only, no Bun.
      - name: Run tool surface docs check
        run: make tool_surface_docs_check
