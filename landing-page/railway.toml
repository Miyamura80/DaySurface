# Railway config-as-code for the landing page.
# Deploy this folder as its own Railway service with Root Directory = landing-page.
# Docs: https://docs.railway.com/reference/config-as-code
#
# Builder defaults to RAILPACK (Railway auto-detects the bun/Node project).
# Set builder = "DOCKERFILE" only if you want a pinned nginx/caddy static serve.
#
# REQUIRED VARIABLE - `DOCS_UPSTREAM`
# This service also fronts the documentation at `daysurface.com/docs`, reverse
# proxying that prefix to the `daysurface-docs` service (see `server.ts`). Set
# it on this service to the docs origin over Railway private networking:
#
#   DOCS_UPSTREAM = http://daysurface-docs.railway.internal:8080
#
# Without it `/docs` answers 503 and the docs are unreachable from the apex.
# `docs.daysurface.com` should be left in place as a 301 to `daysurface.com/docs`
# so existing links and any indexed URLs consolidate onto the apex.

[build]
builder = "RAILPACK"
buildCommand = "bun run build"

[deploy]
# Serve the static `dist/` output via server.ts (sirv + `Accept: text/markdown`
# content negotiation on the canonical URL). Unknown paths fall back to index.html.
startCommand = "bun run start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
