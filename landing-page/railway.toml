# Railway config-as-code for the landing page.
# Deploy this folder as its own Railway service with Root Directory = landing-page.
# Docs: https://docs.railway.com/reference/config-as-code
#
# Builder defaults to RAILPACK (Railway auto-detects the bun/Node project).
# Set builder = "DOCKERFILE" only if you want a pinned nginx/caddy static serve.
#
# REQUIRED VARIABLE - `DOCS_UPSTREAM`
# This service also fronts the documentation at `daysurface.com/docs`, reverse
# proxying the docs-owned prefixes to the docs service (see `docs-proxy.ts` -
# PROXY_PREFIXES is the contract between the two). Set it on this service to the
# docs origin over Railway private networking, referencing the docs service by
# its CURRENT Railway service name:
#
#   DOCS_UPSTREAM = http://${{<docs-service-name>.RAILWAY_PRIVATE_DOMAIN}}:8080
#
# Prefer that reference form over a literal `<name>.railway.internal` host.
#
# RENAMING THE DOCS SERVICE IS A TWO-STEP OPERATION.
# A service's private domain is derived from its name, so a rename moves the
# upstream host. Two things must follow, and neither is automatic:
#   1. `DOCS_UPSTREAM` here must name the new service, and
#   2. THIS service must be redeployed.
# Step 2 is the one that gets missed. `docs-proxy.ts` reads `process.env` per
# request, but a container's environment is fixed at process start - a variable
# edit or a rename does not reach a process that is already running. Until the
# landing page restarts it keeps dialling the old host.
#
# Failure signature, seen twice now: every docs path at the apex answers 502
# with `ConnectionRefused` in this service's deploy logs, while
# `docs.daysurface.com` keeps serving 200 (the public edge reaches the docs
# service directly and never touches private networking). A 200 on the
# subdomain is therefore NOT evidence the proxy is healthy - always probe
# `daysurface.com/docs` itself.
#
# Without the variable those paths answer 503 and the docs are unreachable from
# the apex.
# `docs.daysurface.com` should be left in place as a 301 to `daysurface.com/docs`
# so existing links and any indexed URLs consolidate onto the apex.

[build]
builder = "RAILPACK"
buildCommand = "bun run build"

[deploy]
# Serve the static `dist/` output via server.ts (sirv + `Accept: text/markdown`
# content negotiation on the canonical URL). Unknown paths fall back to index.html.
startCommand = "bun run start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
