example_parent:
  example_child: "prod_value"

# Overrides applied when DEV_ENV=prod.
server:
  host: "0.0.0.0"
  # Browser origins allowed to call the API cross-origin. The landing page
  # (daysurface.com) POSTs the waitlist form here, so its origin must be listed.
  # NOTE: if the deployment sets allowed_origins via a Railway env var instead,
  # add https://daysurface.com there too - the env override wins over this file.
  allowed_origins:
    - "https://daysurface.com"
    - "https://www.daysurface.com"

# One JSON line per log record on stdout, so Railway files each line under its
# real level instead of marking all of stderr as "error".
logging:
  structured: true

# Railway's edge terminates every connection, so the socket peer is the edge's
# IP and every anonymous caller would share one rate-limit bucket. The edge
# sets X-Real-IP to the caller's address (docs.railway.com/networking/
# public-networking/specs-and-limits), so key anonymous limits on that.
rate_limit:
  trust_proxy_headers: true
